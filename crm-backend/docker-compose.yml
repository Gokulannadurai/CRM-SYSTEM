version: '3.8'

services:
  redisservice:
    image: redis:alpine
    ports:
      - 6379:6379
    volumes:
      - cache:/data
    restart: always
    networks:
      - crm-app-db-network

  mypostgres:
    image: postgres
    restart: always
    ports:
      - "5432:5432"
    links:
      - redisservice
    depends_on:
      - redisservice
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_USERNAME=${DATABASE_USERNAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_USER=${DATABASE_USERNAME}
      - POSTGRES_DB=${DATABASE_NAME}
    networks:
      - crm-app-db-network

  userservice:
    image: user-service
    build:
      context: ./user-service
      dockerfile: ./Dockerfile
    ports:
      - "8081:8081"
      - "5007:5007"
    restart: always
    links:
      - redisservice
    depends_on:
      - mypostgres
      - redisservice
    environment:
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5007
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_USERNAME=${DATABASE_USERNAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - JPA_DDL_AUTO=${JPA_DDL_AUTO}
      - HIBERNATE_FORMAT_SQL=${HIBERNATE_FORMAT_SQL}
      - HIBERNATE_BATCH_SIZE=${HIBERNATE_BATCH_SIZE}
      - FLYWAY_ENABLED=${FLYWAY_ENABLED}
      - FLYWAY_BASELINE_ON_MIGRATE=${FLYWAY_BASELINE_ON_MIGRATE}
      - FLYWAY_VALIDATE_ON_MIGRATE=${FLYWAY_VALIDATE_ON_MIGRATE}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION}
      - LOG_LEVEL=${LOG_LEVEL}
      - HIBERNATE_SQL_LOG=${HIBERNATE_SQL_LOG}
      - HIBERNATE_PARAM_LOG=${HIBERNATE_PARAM_LOG}
      - MAIL_SEND=${MAIL_SEND}
      - MAIL_RECIPIENTS=${MAIL_RECIPIENTS}
      - MAIL_SEND_GRID_API_KEY=${MAIL_SEND_GRID_API_KEY}
      - MAIL_FROM=${MAIL_FROM}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_HEADING=${MAIL_HEADING}
    volumes:
        - ./log:/log
    networks:
        - crm-app-db-network

  customerservice:
    image: customer-service
    build:
      context: ./customer-service
      dockerfile: ./Dockerfile
    ports:
      - "8082:8082"
      - "5006:5006"
    restart: always
    links:
      - redisservice
    depends_on:
      - mypostgres
      - redisservice
    environment:
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5006
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_USERNAME=${DATABASE_USERNAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - JPA_DDL_AUTO=${JPA_DDL_AUTO}
      - HIBERNATE_FORMAT_SQL=${HIBERNATE_FORMAT_SQL}
      - HIBERNATE_BATCH_SIZE=${HIBERNATE_BATCH_SIZE}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION}
      - LOG_LEVEL=${LOG_LEVEL}
      - HIBERNATE_SQL_LOG=${HIBERNATE_SQL_LOG}
      - HIBERNATE_PARAM_LOG=${HIBERNATE_PARAM_LOG}
      - USER_SERVICE_URL=${USER_SERVICE_URL}
    volumes:
      - ./log:/log
    networks:
      - crm-app-db-network

  salesservice:
    image: sales-service
    build:
      context: ./sales-service
      dockerfile: ./Dockerfile
    ports:
      - "8083:8083"
      - "5005:5005"
    restart: always
    links:
      - redisservice
    depends_on:
      - mypostgres
      - redisservice
    environment:
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_USERNAME=${DATABASE_USERNAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - JPA_DDL_AUTO=${JPA_DDL_AUTO}
      - HIBERNATE_FORMAT_SQL=${HIBERNATE_FORMAT_SQL}
      - HIBERNATE_BATCH_SIZE=${HIBERNATE_BATCH_SIZE}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION}
      - LOG_LEVEL=${LOG_LEVEL}
      - HIBERNATE_SQL_LOG=${HIBERNATE_SQL_LOG}
      - HIBERNATE_PARAM_LOG=${HIBERNATE_PARAM_LOG}
      - USER_SERVICE_URL=${USER_SERVICE_URL}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME}
    volumes:
      - ./log:/log
    networks:
      - crm-app-db-network

networks:
  crm-app-db-network:
    driver: bridge

volumes:
  cache:
    driver: local
  mypostgres:
    driver: local